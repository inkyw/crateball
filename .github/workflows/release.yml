# Publishing a GitHub release (or running this by hand) runs the full check and, if it passes,
# deploys that exact commit to the VPS behind playcrateball.com.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even while a match is running (rooms are wiped)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
        env:
          CI: 'true'

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH key and pinned host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      - name: Ship and rebuild on the server
        run: |
          VERSION="${{ github.event.release.tag_name || github.sha }}"
          VERSION="${VERSION:0:40}"
          FORCE=""
          [ "${{ inputs.force }}" = "true" ] && FORCE=force
          git archive --format=tar HEAD | ssh -p SSH_PORT -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            root@VPS_IP "deploy $VERSION $FORCE"
      - name: Check the public site
        run: curl -fsS https://playcrateball.com/health
