# Production on the VPS: the game behind Caddy (automatic HTTPS). Deployed by scripts/deploy.sh.
name: crateball
services:
  game:
    build:
      context: ..
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    image: crateball:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '8080'
      APP_VERSION: ${APP_VERSION:-unknown}
    expose: ['8080']
    # Logs go to the server's journal so they survive redeploys (journald caps the total size).
    # Read them with: journalctl -o cat CONTAINER_TAG=crateball-game
    logging:
      driver: journald
      options: { tag: crateball-game }
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  caddy_data:
  caddy_config:
